<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MakerStop - Cutlist Manager</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #333;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #000000 0%, #1a1a1a 100%);
            color: #ff8c00;
            padding: 30px;
            text-align: center;
            border-bottom: 3px solid #ff8c00;
        }

        .logo {
            width: 200px;
            height: auto;
            margin-bottom: 20px;
            filter: brightness(1.2);
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            color: #ff8c00;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .header p {
            opacity: 0.9;
            font-size: 1.1em;
            color: #ffffff;
        }

        .main-content {
            padding: 30px;
        }

        .tabs {
            display: flex;
            border-bottom: 2px solid #eee;
            margin-bottom: 30px;
        }

        .tab {
            flex: 1;
            padding: 15px;
            text-align: center;
            background: #f8f9fa;
            border: none;
            cursor: pointer;
            font-size: 1.1em;
            transition: all 0.3s ease;
        }

        .tab.active {
            background: #ff8c00;
            color: white;
        }

        .tab:hover {
            background: #e9ecef;
        }

        .tab.active:hover {
            background: #e67e00;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #1a1a1a;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 16px;
            transition: border-color 0.3s ease;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #ff8c00;
        }

        .cuts-section {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0;
        }

        .cut-item {
            background: white;
            padding: 15px;
            margin: 10px 0;
            border-radius: 6px;
            border-left: 4px solid #ff8c00;
            display: grid;
            grid-template-columns: 3fr 1fr 1fr 1fr auto;
            gap: 10px;
            align-items: center;
        }

        .cut-item input {
            margin: 0;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
            text-align: center;
        }

        .btn-primary {
            background: #ff8c00;
            color: white;
        }

        .btn-primary:hover {
            background: #e67e00;
            transform: translateY(-2px);
        }

        .btn-success {
            background: #27ae60;
            color: white;
        }

        .btn-success:hover {
            background: #229954;
        }

        .btn-danger {
            background: #e74c3c;
            color: white;
            padding: 8px 12px;
            font-size: 14px;
        }

        .btn-danger:hover {
            background: #c0392b;
        }

        .btn-secondary {
            background: #95a5a6;
            color: white;
        }

        .btn-secondary:hover {
            background: #7f8c8d;
        }

        .btn-warning {
            background: #f39c12;
            color: white;
        }

        .btn-warning:hover {
            background: #e67e22;
        }

        .btn-sm {
            padding: 6px 12px;
            font-size: 14px;
            margin-right: 5px;
        }

        .status-message {
            padding: 15px;
            border-radius: 6px;
            margin: 20px 0;
            font-weight: 600;
        }

        .status-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .status-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .status-info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }

        .cutlist-item {
            background: white;
            padding: 20px;
            margin: 15px 0;
            border-radius: 8px;
            border-left: 4px solid #3498db;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .cutlist-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .cutlist-header h3 {
            color: #2c3e50;
            margin: 0;
        }

        .cutlist-meta {
            color: #7f8c8d;
            font-size: 0.9em;
        }

        .cut-summary {
            background: #ecf0f1;
            padding: 10px;
            border-radius: 4px;
            margin-top: 10px;
        }

        .edit-indicator {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 15px;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        @media (max-width: 768px) {
            .cut-item {
                grid-template-columns: 1fr;
                gap: 5px;
            }

            .tabs {
                flex-direction: column;
            }

            .header h1 {
                font-size: 2em;
            }

            .main-content {
                padding: 15px;
            }

            .button-group {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <img src="/static/MakerStop.png" alt="MakerStop Logo" class="logo">
            <h1>Cutlist Manager</h1>
            
        </div>

        <div class="main-content">
            <div class="tabs">
                <button class="tab active" id="create-tab-btn" onclick="showTab('create')">Create Cutlist</button>
                <button class="tab" id="view-tab-btn" onclick="showTab('view')">View Saved</button>
                <button class="tab" id="status-tab-btn" onclick="showTab('status')">Status</button>
            </div>

            <!-- Create Cutlist Tab -->
            <div id="create-tab" class="tab-content active">
                <div id="edit-indicator" style="display: none;"></div>
                
                <form id="cutlist-form">
                    <div class="form-group">
                        <label for="project-name">Project Name</label>
                        <input type="text" id="project-name" name="project-name" required placeholder="Enter project name">
                    </div>

                    <div class="form-group">
                        <label for="customer-name">Customer Name (Optional)</label>
                        <input type="text" id="customer-name" name="customer-name" placeholder="Enter customer name">
                    </div>

                    <div class="cuts-section">
                        <h3>Cuts Required</h3>
                        <div id="cuts-container">
                            <div class="cut-item">
                                <input type="text" placeholder="Description" name="description" required>
                                <input type="number" placeholder="Length" name="length" step="0.01" required>
                                <input type="number" placeholder="Qty" name="quantity" min="1" value="1" required>
                                <input type="text" placeholder="Material" name="material" required>
                                <button type="button" class="btn btn-danger" onclick="removeCut(this)">Remove</button>
                            </div>
                        </div>
                        
                        <button type="button" class="btn btn-secondary" onclick="addCut()">Add Another Cut</button>
                    </div>

                    <div class="button-group">
                        <button type="button" id="cancel-btn" class="btn btn-secondary" onclick="exitEditMode()" style="display: none;">Cancel Edit</button>
                        <button type="submit" id="submit-btn" class="btn btn-primary">Send Cutlist</button>
                    </div>
                </form>

                <div id="status-message"></div>
            </div>

            <!-- View Saved Tab -->
            <div id="view-tab" class="tab-content">
                <button class="btn btn-primary" onclick="loadCutlists()">Refresh List</button>
                <div id="cutlists-container">
                    <p>Click "Refresh List" to load saved cutlists...</p>
                </div>
            </div>

            <!-- Status Tab -->
            <div id="status-tab" class="tab-content">
                <button class="btn btn-primary" onclick="checkStatus()">Check Server Status</button>
                <div id="server-status">
                    <p>Click "Check Server Status" to verify connection...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Global variables for edit mode
        let currentEditingTxtFile = null;

        // Tab switching
        function showTab(tabName) {
            // Hide all tabs
            document.querySelectorAll('.tab-content').forEach(tab => {
                tab.classList.remove('active');
            });
            document.querySelectorAll('.tab').forEach(tab => {
                tab.classList.remove('active');
            });

            // Show selected tab
            document.getElementById(tabName + '-tab').classList.add('active');
            document.getElementById(tabName + '-tab-btn').classList.add('active');
        }

        // Add new cut row
        function addCut() {
            const container = document.getElementById('cuts-container');
            const newCut = document.createElement('div');
            newCut.className = 'cut-item';
            newCut.innerHTML = `
                <input type="text" placeholder="Description" name="description" required>
                <input type="number" placeholder="Length" name="length" step="0.01" required>
                <input type="number" placeholder="Qty" name="quantity" min="1" value="1" required>
                <input type="text" placeholder="Material" name="material" required>
                <button type="button" class="btn btn-danger" onclick="removeCut(this)">Remove</button>
            `;
            container.appendChild(newCut);
        }

        // Remove cut row
        function removeCut(button) {
            const container = document.getElementById('cuts-container');
            if (container.children.length > 1) {
                button.parentElement.remove();
            } else {
                showMessage('Cannot remove the last cut item', 'error');
            }
        }

        // Show status message
        function showMessage(message, type) {
            const statusDiv = document.getElementById('status-message');
            statusDiv.innerHTML = `<div class="status-message status-${type}">${message}</div>`;
            setTimeout(() => {
                statusDiv.innerHTML = '';
            }, 5000);
        }

        // Edit cutlist function
        async function editCutlist(txtFilename) {
            try {
                console.log('Loading cutlist for editing:', txtFilename);
                
                const response = await fetch(`/api/cutlist/txt/${txtFilename}`);
                if (!response.ok) {
                    throw new Error('Failed to load cutlist');
                }
                
                const cutlistData = await response.json();
                console.log('Loaded cutlist data:', cutlistData);
                
                // Store the filename we're editing
                currentEditingTxtFile = txtFilename;
                
                // Switch to the create tab
                showTab('create');
                
                // Clear existing form
                clearForm();
                
                // Populate the form
                document.getElementById('project-name').value = cutlistData.project_name || '';
                
                // Add all cuts
                cutlistData.cuts.forEach(cut => {
                    addCutWithData(cut.description, cut.length, cut.quantity, cut.material);
                });
                
                // Remove the initial empty cut if we added cuts
                if (cutlistData.cuts.length > 0) {
                    const container = document.getElementById('cuts-container');
                    const firstCut = container.firstElementChild;
                    if (firstCut.querySelector('input[name="description"]').value === '') {
                        firstCut.remove();
                    }
                }
                
                // Enter edit mode
                enterEditMode(txtFilename);
                
                showMessage(`Loaded "${cutlistData.project_name}" for editing`, 'success');
                
            } catch (error) {
                console.error('Error loading cutlist:', error);
                showMessage('Failed to load cutlist for editing', 'error');
            }
        }

        // Add cut with data
        function addCutWithData(description, length, quantity, material) {
            const container = document.getElementById('cuts-container');
            const newCut = document.createElement('div');
            newCut.className = 'cut-item';
            newCut.innerHTML = `
                <input type="text" placeholder="Description" name="description" value="${description}" required>
                <input type="number" placeholder="Length" name="length" step="0.01" value="${length}" required>
                <input type="number" placeholder="Qty" name="quantity" min="1" value="${quantity}" required>
                <input type="text" placeholder="Material" name="material" value="${material}" required>
                <button type="button" class="btn btn-danger" onclick="removeCut(this)">Remove</button>
            `;
            container.appendChild(newCut);
        }

        // Enter edit mode
        function enterEditMode(txtFilename) {
            // Show edit indicator
            const indicator = document.getElementById('edit-indicator');
            indicator.innerHTML = `<strong>Editing:</strong> ${txtFilename}`;
            indicator.style.display = 'block';
            
            // Change submit button
            const submitBtn = document.getElementById('submit-btn');
            submitBtn.textContent = `Update ${txtFilename}`;
            submitBtn.classList.remove('btn-primary');
            submitBtn.classList.add('btn-warning');
            
            // Show cancel button
            const cancelBtn = document.getElementById('cancel-btn');
            cancelBtn.style.display = 'inline-block';
        }

        // Exit edit mode
        function exitEditMode() {
            currentEditingTxtFile = null;
            
            // Hide edit indicator
            document.getElementById('edit-indicator').style.display = 'none';
            
            // Reset submit button
            const submitBtn = document.getElementById('submit-btn');
            submitBtn.textContent = 'Send Cutlist';
            submitBtn.classList.remove('btn-warning');
            submitBtn.classList.add('btn-primary');
            
            // Hide cancel button
            document.getElementById('cancel-btn').style.display = 'none';
            
            // Clear form
            clearForm();
            
            showMessage('Edit cancelled', 'info');
        }

        // Clear form
        function clearForm() {
            document.getElementById('project-name').value = '';
            document.getElementById('customer-name').value = '';
            const container = document.getElementById('cuts-container');
            container.innerHTML = `
                <div class="cut-item">
                    <input type="text" placeholder="Description" name="description" required>
                    <input type="number" placeholder="Length" name="length" step="0.01" required>
                    <input type="number" placeholder="Qty" name="quantity" min="1" value="1" required>
                    <input type="text" placeholder="Material" name="material" required>
                    <button type="button" class="btn btn-danger" onclick="removeCut(this)">Remove</button>
                </div>
            `;
        }

        // Handle form submission
        document.getElementById('cutlist-form').addEventListener('submit', async function(e) {
            e.preventDefault();

            const formData = new FormData(this);
            const cutItems = document.querySelectorAll('.cut-item');
            
            const cuts = [];
            cutItems.forEach(item => {
                const inputs = item.querySelectorAll('input');
                if (inputs[0].value.trim() && inputs[1].value && inputs[3].value.trim()) {
                    cuts.push({
                        description: inputs[0].value.trim(),
                        length: parseFloat(inputs[1].value),
                        quantity: parseInt(inputs[2].value) || 1,
                        material: inputs[3].value.trim()
                    });
                }
            });

            if (cuts.length === 0) {
                showMessage('Please add at least one cut', 'error');
                return;
            }

            const cutlistData = {
                project_name: formData.get('project-name'),
                customer_name: formData.get('customer-name'),
                cuts: cuts,
                created_at: new Date().toISOString()
            };

            try {
                const response = await fetch('/api/cutlist', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(cutlistData)
                });

                const result = await response.json();
                
                if (result.status === 'success') {
                    if (currentEditingTxtFile) {
                        showMessage(`Cutlist "${cutlistData.project_name}" updated successfully!`, 'success');
                        exitEditMode();
                    } else {
                        showMessage(`Cutlist "${cutlistData.project_name}" sent successfully!`, 'success');
                        this.reset();
                        clearForm();
                    }
                } else {
                    showMessage('Error: ' + result.message, 'error');
                }
            } catch (error) {
                showMessage('Error sending cutlist: ' + error.message, 'error');
            }
        });

        // Load saved cutlists
        async function loadCutlists() {
            try {
                const response = await fetch('/api/cutlists');
                const cutlists = await response.json();
                
                const container = document.getElementById('cutlists-container');
                
                if (cutlists.length === 0) {
                    container.innerHTML = '<p>No saved cutlists found.</p>';
                    return;
                }

                container.innerHTML = cutlists.map(cutlist => `
                    <div class="cutlist-item">
                        <div class="cutlist-header">
                            <h3>${cutlist.project_name}</h3>
                            <div class="cutlist-meta">
                                ${cutlist.created} | ${cutlist.cut_count} cuts
                            </div>
                        </div>
                        <div class="cut-summary">
                            <strong>File:</strong> ${cutlist.filename}
                        </div>
                        <div class="button-group">
                            <button class="btn btn-sm btn-warning" onclick="editCutlist('${cutlist.txt_filename || cutlist.filename.replace('.json', '.txt')}')">Edit</button>
                            <a href="/download/${cutlist.txt_filename || cutlist.filename.replace('.json', '.txt')}" class="btn btn-sm btn-success" download>Download TXT</a>
                            <a href="/download/${cutlist.filename}" class="btn btn-sm btn-secondary">Download JSON</a>
                        </div>
                    </div>
                `).join('');
                
            } catch (error) {
                document.getElementById('cutlists-container').innerHTML = 
                    `<p style="color: red;">Error loading cutlists: ${error.message}</p>`;
            }
        }

        // Check server status
        async function checkStatus() {
            try {
                const response = await fetch('/status');
                const status = await response.json();
                
                document.getElementById('server-status').innerHTML = `
                    <div class="status-message status-success">
                        <strong>Server Status:</strong> ${status.status}<br>
                        <strong>Server Time:</strong> ${status.server_time}<br>
                        <strong>Stored Cutlists:</strong> ${status.cutlists_stored}
                    </div>
                `;
            } catch (error) {
                document.getElementById('server-status').innerHTML = `
                    <div class="status-message status-error">
                        <strong>Connection Error:</strong> ${error.message}
                    </div>
                `;
            }
        }
    </script>
</body>
</html>
